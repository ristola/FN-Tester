; PlatformIO Project Configuration File
;
; CYD 4.3" FN Tester
; Board: Sunton ESP32-8048S043C (4.3" 800x480 IPS, GT911 capacitive touch,
;        ESP32-S3, 16MB flash / 8MB PSRAM, microSD, USB-C)

[env:esp32-8048S043C]
; espnow_minimal_test/ belongs to the isolated [env:espnow-minimal-test]
; diagnostic build below, not the real app - exclude it here so both envs
; can share one src_dir without colliding setup()/loop() definitions.
build_src_filter = +<*> -<espnow_minimal_test/>
; Tested pinning to the older, stable espressif32@6.3.2 (vs. this
; project's normal unpinned resolution, which lands on 6.11.0 - a release
; that bundles a git-sha-tagged development snapshot of the Arduino-ESP32
; core rather than a stable tagged release) as a theory for a real-hardware
; ESP_ERR_ESPNOW_NO_MEM bug (permanent/irreversible once triggered,
; unrelated to free heap or free DMA-capable heap - both ruled out via
; heap_caps_get_free_size() logging). 6.3.2 reproduced the identical
; failure, ruling out the platform/core version as the cause - reverted to
; unpinned since the older version has no offsetting benefit. See
; espnow_state.cpp's recover_espnow() for the actual mitigation in place.
platform = espressif32
board = esp32-8048S043C
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

; Tried bumping to 921600 (top of esptool's documented baud list) but this
; board's USB-serial bridge couldn't hold it ("Unable to verify flash chip
; connection") - back to the board's documented-working default.
upload_speed = 460800


build_flags =
    -Ofast
    -Wall
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'

lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    lvgl/lvgl@9.5.0

; OTA firmware updates over Wi-Fi (ArduinoOTA, set up in main.cpp) - use
; `pio run -e esp32-8048S043C-ota -t upload` instead of the default env, or
; the PlatformIO IDE's own Project Tasks / status-bar environment picker
; (this env shows up there automatically, no extra IDE config needed).
; upload_port defaults to the device's mDNS hostname (matches
; ArduinoOTA.setHostname("cydfn") in main.cpp) so this doesn't need
; updating every time its DHCP-leased IP changes; override per-invocation
; with `--upload-port <ip>` if mDNS resolution isn't reliable on your
; network. --auth must match main.cpp's ArduinoOTA.setPassword().
[env:esp32-8048S043C-ota]
extends = env:esp32-8048S043C
upload_protocol = espota
upload_port = cydfn.local
upload_flags =
    --auth=5512

; Isolated ESP_ERR_ESPNOW_NO_MEM diagnostic - same board/core/platform as the
; main app, but WiFi+ESP-NOW only (no LVGL/LovyanGFX/touch/SD/OTA). Used to
; determine whether the NO_MEM lockup is a bare hardware/platform issue or
; specific to something in the full application. See espnow_state.cpp's
; recover_espnow() comment for the full investigation history.
[env:espnow-minimal-test]
; Deliberately NOT board=esp32-8048S043C (the custom Sunton board manifest) -
; this test needs no display/touch/PSRAM config, and that manifest's PSRAM
; (qio_opi) settings don't match this chip's actual PSRAM wiring, which
; would add an unrelated confound. esp32-s3-devkitc-1 is a stock, no-PSRAM,
; 8MB-flash ESP32-S3 definition - same MCU/flash size, none of the custom
; display-board baggage.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = -<*> +<espnow_minimal_test/*>
lib_deps =
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; Temporarily slowed from 460800 - repeated upload failures ("Invalid head
; of packet" / "Serial data stream stopped") always right after writing the
; bootloader block, consistent with a marginal USB link under the higher
; current/timing demands of flashing rather than anything code-related.
upload_speed = 115200
build_flags =
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
