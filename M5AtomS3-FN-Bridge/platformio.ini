; PlatformIO Project Configuration File
;
; M5Stack Atom S3 Lite - FN two-wire pod
; Board: ESP32-S3, onboard WS2812 RGB LED (GPIO35), front button (GPIO41),
;        Grove port (GPIO1/GPIO2), USB-C (native USB CDC).
; No LCD/IMU on the Lite variant (unlike the full AtomS3) - PlatformIO's
; "m5stack-atoms3" board definition is still the right MCU/flash match.
;
; No OTA env: this pod deliberately never joins Wi-Fi (see main.cpp) - it
; only sets its radio to the mesh's ESP-NOW channel, so it never gets an
; IP address and can't do network OTA (which needs mDNS/UDP over IP).
; Reflash over USB.

[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino

; LittleFS on the board's default "spiffs"-labeled data partition
; (default_8MB.csv, 1.5MB - plenty for data/sim_captures/'s ~90KB). Built
; from data/ and flashed separately from the app: `pio run -t uploadfs`.
board_build.filesystem = littlefs

monitor_speed = 115200

build_flags =
    -Wall
    '-D BOARD_NAME="${this.board}"'
    ; The board def sets ARDUINO_USB_MODE=1 (native USB) but not this - without
    ; it, Serial silently doesn't attach to the USB-C CDC port at boot.
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
